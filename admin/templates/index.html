<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ proxy_name }} — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3a;
      --accent:  #5b8af5;
      --green:   #3ecf8e;
      --red:     #f66;
      --text:    #e2e8f0;
      --muted:   #8892a4;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 18px; font-weight: 600; }
    #last-updated { font-size: 12px; color: var(--muted); }

    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* ── stat cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
    .card .value { font-size: 32px; font-weight: 700; line-height: 1; }
    .card .sub   { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .card.accent .value { color: var(--accent); }
    .card.green  .value { color: var(--green);  }

    /* ── chart panels ── */
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 16px;
    }
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .chart-box h2 { font-size: 13px; font-weight: 600; margin-bottom: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .chart-box canvas { width: 100% !important; }

    /* ── time range tabs ── */
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: all .15s;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }
  </style>
</head>
<body>

<header>
  <h1><span class="status-dot" id="dot"></span>{{ proxy_name }}</h1>
  <span id="last-updated">Loading…</span>
</header>

<main>
  <!-- stat cards -->
  <div class="cards">
    <div class="card accent">
      <div class="label">Active connections</div>
      <div class="value" id="active">—</div>
      <div class="sub">right now</div>
    </div>
    <div class="card">
      <div class="label">Total connections</div>
      <div class="value" id="total">—</div>
      <div class="sub">all-time</div>
    </div>
    <div class="card">
      <div class="label">Peak active</div>
      <div class="value" id="peak">—</div>
      <div class="sub">ever recorded</div>
    </div>
    <div class="card green">
      <div class="label">Traffic in</div>
      <div class="value" id="tin">—</div>
      <div class="sub">bytes received</div>
    </div>
    <div class="card">
      <div class="label">Traffic out</div>
      <div class="value" id="tout">—</div>
      <div class="sub">bytes sent</div>
    </div>
    <div class="card">
      <div class="label">Crashes</div>
      <div class="value" id="crashes">—</div>
      <div class="sub">since container start</div>
    </div>
  </div>

  <!-- time range selector -->
  <div class="tabs">
    <button class="tab" data-h="1">1 h</button>
    <button class="tab active" data-h="24">24 h</button>
    <button class="tab" data-h="168">7 d</button>
    <button class="tab" data-h="720">30 d</button>
  </div>

  <!-- charts -->
  <div class="charts">
    <div class="chart-box">
      <h2>Active connections</h2>
      <canvas id="chart-conns" height="220"></canvas>
    </div>
    <div class="chart-box">
      <h2>Traffic (bytes)</h2>
      <canvas id="chart-traffic" height="220"></canvas>
    </div>
  </div>
</main>

<script>
const fmt = {
  number: n => n == null ? '—' : Number(n).toLocaleString(),
  bytes:  b => {
    if (b == null) return '—';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
    return b.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
  },
  time: ts => new Date(ts * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
};

// Chart defaults
Chart.defaults.color = '#8892a4';
Chart.defaults.borderColor = '#2a2d3a';

function makeChart(id, datasets, yFormat) {
  const ctx = document.getElementById(id);
  return new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets },
    options: {
      responsive: true,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, padding: 16 } } },
      scales: {
        x: { grid: { color: '#1e2130' }, ticks: { maxTicksLimit: 8, maxRotation: 0 } },
        y: {
          grid: { color: '#1e2130' },
          ticks: { callback: yFormat },
          beginAtZero: true,
        },
      },
    },
  });
}

const connChart = makeChart('chart-conns', [
  { label: 'Active',  data: [], borderColor: '#5b8af5', backgroundColor: 'rgba(91,138,245,.08)', fill: true, tension: .3, pointRadius: 2 },
], v => fmt.number(v));

const trafficChart = makeChart('chart-traffic', [
  { label: 'Ingress', data: [], borderColor: '#3ecf8e', backgroundColor: 'rgba(62,207,142,.08)', fill: true, tension: .3, pointRadius: 2 },
  { label: 'Egress',  data: [], borderColor: '#f6a623', backgroundColor: 'rgba(246,166,35,.08)',  fill: true, tension: .3, pointRadius: 2 },
], v => fmt.bytes(v));

async function loadCurrent() {
  try {
    const d = await fetch('/api/current').then(r => r.json());
    document.getElementById('active').textContent   = fmt.number(d.active_conns);
    document.getElementById('total').textContent    = fmt.number(d.total_conns);
    document.getElementById('crashes').textContent  = fmt.number(d.crashes);
    document.getElementById('tin').textContent      = fmt.bytes(d.traffic_in);
    document.getElementById('tout').textContent     = fmt.bytes(d.traffic_out);
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date(d.ts * 1000).toLocaleTimeString();
    document.getElementById('dot').style.background = '#3ecf8e';
  } catch {
    document.getElementById('dot').style.background = '#f66';
  }
}

async function loadSummary() {
  const d = await fetch('/api/summary').then(r => r.json());
  document.getElementById('peak').textContent = fmt.number(d.peak_active);
}

async function loadHistory(hours) {
  const rows = await fetch(`/api/history?hours=${hours}`).then(r => r.json());
  const labels  = rows.map(r => fmt.time(r.ts));
  connChart.data.labels = labels;
  connChart.data.datasets[0].data = rows.map(r => r.active_conns);
  connChart.update();

  trafficChart.data.labels = labels;
  trafficChart.data.datasets[0].data = rows.map(r => r.traffic_in);
  trafficChart.data.datasets[1].data = rows.map(r => r.traffic_out);
  trafficChart.update();
}

let currentHours = 24;

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentHours = parseInt(btn.dataset.h);
    loadHistory(currentHours);
  });
});

async function refresh() {
  await Promise.all([loadCurrent(), loadSummary(), loadHistory(currentHours)]);
}

refresh();
setInterval(refresh, 60_000);
</script>
</body>
</html>
