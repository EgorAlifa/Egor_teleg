# Dante SOCKS5 configuration — optimised for Telegram
# Port and external interface are patched at runtime by entrypoint.sh

logoutput: /var/log/danted.log
errorlog:  /var/log/danted_err.log

# Listen on all container interfaces
internal: 0.0.0.0 port = 1080

# Outbound interface — overwritten at runtime with detected VPN iface
external: eth0

# ── Auth (overridden to 'username' by entrypoint if SOCKS_USER is set) ────────
clientmethod: none
socksmethod: none

# ── Timeouts (seconds) — tuned for Telegram long-lived connections ────────────
timeout.negotiate: 30
timeout.io:        86400   # 24 h — Telegram keeps persistent connections
timeout.tcp_fin_wait: 30

# ── Client rules ──────────────────────────────────────────────────────────────
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

# ── SOCKS rules ───────────────────────────────────────────────────────────────
# TCP CONNECT — used by Telegram for messaging, calls (port 80/443/5222)
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: error
    socksmethod: none
}

# UDP ASSOCIATE — used by Telegram voice/video
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: udpassociate
    log: error
    socksmethod: none
}
